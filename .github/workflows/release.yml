# Builds SharkHunter apps for Windows, macOS (Apple Silicon + Intel) and Linux
# and publishes them as a GitHub Release named after the version in package.json.
# Runs on every push to main, on version tags, or by hand (Actions > release > Run workflow).
name: release
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14   # a Mac, so the macOS apps can be signed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: sign macOS apps (ad-hoc, required on Apple Silicon)
        run: |
          codesign --force --sign - dist/sharkhunter-macos-arm64
          codesign --force --sign - dist/sharkhunter-macos-x64
      - name: package
        run: bash tools/package.sh
      - name: version
        id: v
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: SharkHunter ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release/*
          make_latest: true
          body: |
            ## Download
            | System | File |
            |---|---|
            | Windows | `SharkHunter-windows.zip`: unzip, double-click `SharkHunter.exe` (More info → Run anyway) |
            | Mac M1/M2/M3/M4 | `SharkHunter-mac-apple-silicon.zip`: unzip, right-click `SharkHunter` → Open |
            | Mac Intel | `SharkHunter-mac-intel.zip`: same as above |
            | Linux | `SharkHunter-linux.tar.gz`: `./sharkhunter` |

            Paper trading: no real orders, no wallet. See the README for the full guide.
